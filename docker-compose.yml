services:
  # PostgreSQL Database Service
  db:
    image: postgres:15
    container_name: productivity_hub_db
    environment:
      # Database credentials (matches your config.py)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB} 
    ports:
      # Map container port 5432 to host port 5432
      - "5432:5432"
    volumes:
      # Persist database data (survives container restarts)
      - postgres_data:/var/lib/postgresql/data
      # Mount SQL files for easy initialization
      - ./sql/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      # Check if database is ready
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Flask Application Service
  web:
    build: .
    container_name: productivity_hub_web
    environment:
      # Tell Flask app how to connect to database
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FLASK_APP: run.py
      FLASK_ENV: development
    ports:
      # Map container port 5000 to host port 5000
      - "5000:5000"
    volumes:
      # Mount code for development (changes reflect immediately)
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: python run.py

# Named volume for database persistence
volumes:
  postgres_data:
